<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Insay Razy profile illustration">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#050816"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C08A6A"/>
      <stop offset="1" stop-color="#9A6A50"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="250" r="170" fill="#6366F1" opacity="0.35" filter="url(#glow)"/>
  <circle cx="420" cy="140" r="70" fill="#22D3EE" opacity="0.25" filter="url(#glow)"/>
  <!-- shoulders / jacket -->
  <path d="M95 600c8-118 92-190 205-190s197 72 205 190Z" fill="url(#shirt)"/>
  <path d="M95 600c8-118 92-190 205-190s197 72 205 190Z" fill="#050816" opacity="0.25"/>
  <path d="M248 418 300 500l52-82c-16-6-34-9-52-9s-36 3-52 9Z" fill="#0F172A"/>
  <path d="M262 414 300 476l38-62" fill="none" stroke="#E2E8F0" stroke-width="6" stroke-linejoin="round" opacity="0.85"/>
  <!-- neck -->
  <path d="M262 340h76v72c-10 14-24 22-38 22s-28-8-38-22Z" fill="url(#skin)"/>
  <path d="M262 372c22 16 54 16 76 0v-20h-76Z" fill="#000" opacity="0.18"/>
  <!-- head -->
  <ellipse cx="300" cy="262" rx="92" ry="108" fill="url(#skin)"/>
  <ellipse cx="208" cy="272" rx="14" ry="24" fill="url(#skin)"/>
  <ellipse cx="392" cy="272" rx="14" ry="24" fill="url(#skin)"/>
  <!-- hair -->
  <path d="M206 250c-10-78 38-126 98-126 66 0 108 44 96 124-10-34-30-58-62-70-38 18-90 22-132 8-2 20-2 40 0 64Z" fill="url(#hair)"/>
  <path d="M220 170c30-34 120-44 162-6" fill="none" stroke="#22D3EE" stroke-width="3" opacity="0.35"/>
  <!-- face details -->
  <path d="M252 262c10-6 24-6 34 0M314 262c10-6 24-6 34 0" stroke="#1F2937" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="269" cy="282" r="6" fill="#111827"/>
  <circle cx="331" cy="282" r="6" fill="#111827"/>
  <path d="M300 290v28c0 6-6 8-12 6" stroke="#7C4A33" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M276 336c14 12 34 12 48 0" stroke="#5B2E1E" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- glasses -->
  <rect x="240" y="262" width="54" height="40" rx="14" fill="#22D3EE" fill-opacity="0.08" stroke="#E2E8F0" stroke-width="4"/>
  <rect x="306" y="262" width="54" height="40" rx="14" fill="#22D3EE" fill-opacity="0.08" stroke="#E2E8F0" stroke-width="4"/>
  <path d="M294 280h12" stroke="#E2E8F0" stroke-width="4"/>
  <!-- rim light -->
  <path d="M208 262c0-62 40-112 92-112" fill="none" stroke="url(#rim)" stroke-width="5" stroke-linecap="round"/>
  <path d="M110 590c12-90 80-156 170-170" fill="none" stroke="url(#rim)" stroke-width="5" stroke-linecap="round"/>
  <!-- code glyphs -->
  <g font-family="monospace" font-size="26" fill="#22D3EE" opacity="0.5">
    <text x="58" y="120">&lt;/&gt;</text>
    <text x="470" y="430">{ }</text>
    <text x="490" y="230" fill="#A855F7">=&gt;</text>
  </g>
</svg>
